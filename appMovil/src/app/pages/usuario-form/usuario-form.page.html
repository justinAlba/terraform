<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/usuarios-list"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ esEdicion ? 'Editar usuario' : 'Nuevo usuario' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input formControlName="nombre"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Correo</ion-label>
      <ion-input type="email" formControlName="email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">
        {{ esEdicion ? 'Nueva contrasena (opcional)' : 'Contrasena' }}
      </ion-label>
      <ion-input type="password" formControlName="password"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label>Rol</ion-label>
      <ion-select formControlName="rol">
        <ion-select-option value="USUARIO">USUARIO</ion-select-option>
        <ion-select-option value="ADMIN">ADMIN</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-text color="danger" *ngIf="error$ | async as error">
      <p class="ion-padding-top">{{ error }}</p>
    </ion-text>

    <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="(cargando$ | async)">
      <ion-spinner *ngIf="cargando$ | async" name="dots"></ion-spinner>
      <span *ngIf="!(cargando$ | async)">Guardar</span>
    </ion-button>
  </form>
</ion-content>

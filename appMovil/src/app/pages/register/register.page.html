<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Crear cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input formControlName="nombre" autocomplete="name"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Correo</ion-label>
      <ion-input type="email" formControlName="email" autocomplete="email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Contrasena</ion-label>
      <ion-input type="password" formControlName="password" autocomplete="new-password"></ion-input>
    </ion-item>

    <ion-text color="danger" *ngIf="error$ | async as error">
      <p class="ion-padding-top">{{ error }}</p>
    </ion-text>

    <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="(cargando$ | async)">
      <ion-spinner *ngIf="cargando$ | async" name="dots"></ion-spinner>
      <span *ngIf="!(cargando$ | async)">Registrarme</span>
    </ion-button>

    <ion-button expand="block" fill="clear" routerLink="/login">
      Ya tengo una cuenta
    </ion-button>
  </form>
</ion-content>

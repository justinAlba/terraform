services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: actividad_api
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: nohaymana
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d actividad_api"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: actividad_api
      DB_USER: admin
      DB_PASSWORD: nohaymana
      JWT_SECRET: Q0p29m+qFgeRAT4qopoPBBbMDQZsCM4RnqYOTOqhE+xsz8JMDqoQTgnHNbCAOxUnho7HaBIvGH+fBF1H4nSRHg
      JWT_EXPIRATION_MS: 3600000
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "8080:8080"

volumes:
  db_data:
  uploads_data:
